<!doctype html>
<html lang="en" data-km-appearance="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Content Generation Studio</title>
    <script>
      // Apply stored preferences before first paint so dark/density/locale do
      // not flash the light default. The React provider takes over afterwards.
      (() => {
        try {
          const stored = JSON.parse(localStorage.getItem("content-gen:studio-preferences") || "{}");
          const appearance =
            stored.appearance ||
            (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
          const density = stored.density || "spacious";
          const locale = stored.locale === "ja" ? "ja" : "en";
          const root = document.documentElement;
          root.setAttribute("data-km-appearance", appearance);
          root.setAttribute("data-km-density", density);
          root.setAttribute("lang", locale);
        } catch {
          // Storage can be unavailable; keep the light defaults in markup.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

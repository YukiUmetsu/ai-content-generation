[workspace]
members = ["crates/core", "crates/server"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
license = "UNLICENSED"

[workspace.dependencies]
axum = "0.8"
http-body-util = "0.1"
rusqlite = { version = "0.37", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "time", "sync"] }
tower = { version = "0.5", features = ["util"] }

# Small workstation: keep our own code fast to rebuild, dependencies optimized.
[profile.dev]
debug = 1

[profile.dev.package."*"]
opt-level = 2

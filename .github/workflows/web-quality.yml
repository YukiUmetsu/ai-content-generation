name: Web quality

on:
  pull_request:
    paths:
      - "apps/web/**"
      - ".github/workflows/web-quality.yml"
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - ".github/workflows/web-quality.yml"

permissions:
  contents: read

jobs:
  quality:
    name: Install, verify and test web app
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.22.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify pinned Kumiki sources
        run: pnpm kumiki:verify

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Production build
        run: pnpm build

      # This uses local, original character ZIPs and synthetic narration timing.
      # No Fish Audio key, paid TTS or external asset retrieval is involved.
      - name: Install Chromium and FFmpeg for visual animation QA
        run: |
          pnpm exec playwright install --with-deps chromium
          sudo apt-get install -y ffmpeg

      - name: Verify saved Pip and Quill animation in real Chromium
        run: |
          CHROME="$(node --input-type=module -e "import { chromium } from 'playwright-core'; process.stdout.write(chromium.executablePath())")"
          test -x "$CHROME"
          CONTENTGEN_CHROMIUM_EXECUTABLE="$CHROME" CONTENTGEN_BROWSER_TEST_NO_SANDBOX=1 pnpm test:video:browser

      # These use synthetic providers/browser drivers, not FFmpeg or Chromium.
      # Real media encoding, muxing and audio probes are local release gates.
      - name: Test video planning and mock production without media tools
        run: |
          node --test \
            scripts/video-production/cli.test.mjs \
            scripts/video-production/cli-signal.test.mjs \
            scripts/video-production/fish.test.mjs \
            scripts/video-production/local.test.mjs \
            scripts/video-production/job.test.mjs \
            scripts/video-production/topic-generator.test.mjs \
            scripts/video-production/general-visual-plan.test.mjs \
            scripts/video-production/character-rig-render.test.mjs \
            scripts/video-production/visual-plan.test.mjs \
            scripts/video-production/timeline.test.mjs \
            scripts/video-production/produce.test.mjs \
            scripts/video-production/report.test.mjs \
            scripts/video-production/stage-server.test.mjs \
            scripts/video-production/studio-server.test.mjs \
            scripts/video-production/text-layout.test.mjs \
            scripts/video-production/topic-cli.test.mjs \
            scripts/video-production/try.test.mjs \
            scripts/video-production/research-job-planner.test.mjs \
            scripts/video-production/research-job-queue.test.mjs \
            scripts/video-production/evidence-link-repair.test.mjs \
            scripts/video-production/research-model-settings.test.mjs \
            scripts/video-production/model-profiles.test.mjs \
            scripts/director-studio-vite.test.mjs

# Private single-user instance, API enabled for ContentGen.
# SearXNG defaults supply engines; explicit JSON permission is essential.
use_default_settings: true
general:
  debug: false
  instance_name: "ContentGen Local Search"
search:
  safe_search: 1
  formats:
    - html
    - json
server:
  public_instance: false
  limiter: false
  image_proxy: false
  # Secret is supplied by SEARXNG_SECRET from the ignored generated .env.

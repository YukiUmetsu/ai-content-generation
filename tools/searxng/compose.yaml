# ContentGen-only, single-container local search. No public ports or web dashboard exposure.
name: contentgen-local-search
services:
  searxng:
    image: ghcr.io/searxng/searxng:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SEARXNG_PORT:?Run pnpm research:up}:8080"
    environment:
      SEARXNG_BASE_URL: "http://127.0.0.1:${SEARXNG_PORT}/"
      SEARXNG_SECRET: "${SEARXNG_SECRET:?Run pnpm research:up to create a local secret}"
      SEARXNG_LIMITER: "false"
      FORCE_OWNERSHIP: "false"
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:ro
      - searxng-cache:/var/cache/searxng
    security_opt:
      - no-new-privileges:true
volumes:
  searxng-cache:
